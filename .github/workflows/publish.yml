name: Publish

# Manual publish for the action: generate notes from BREAKING/feat/fix commits
# since the last release, tag vX.Y.Z, move the vN major tag, and publish a
# GitHub Release. Tags are not branch-protected, so no PR/approval dance needed.
on:
  workflow_dispatch:
    inputs:
      from:
        description: "Base ref/commit for the notes (default: last release tag)."
        required: false
        default: ""
      to:
        description: "Head ref/commit for the notes (default: HEAD)."
        required: false
        default: ""
      version:
        description: "Explicit version, e.g. 1.2.0 (default: computed from commits)."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: lite-actions/git-checkout@90733d329cd6c632c7597660341002e1a1377c44 # v1.1.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Generate release notes
        id: notes
        uses: lite-actions/release-notes@v1
        with:
          from: ${{ github.event.inputs.from }}
          to: ${{ github.event.inputs.to }}
          version: ${{ github.event.inputs.version }}

      # Decide from the notes themselves whether there is anything to release.
      # Matches the section headings, not the "_No user-facing changes ..._"
      # sentence: the headings are a tested contract in release-notes, and
      # matching them fails closed - anything unrecognised stops the release.
      - name: Check the notes for releasable content
        id: gate
        shell: bash
        env:
          NOTES_FILE: ${{ steps.notes.outputs.file }}
        run: |
          set -euo pipefail
          if [ ! -f "${NOTES_FILE}" ]; then
            echo "::error::release-notes produced no file at '${NOTES_FILE}'."
            exit 1
          fi
          if grep -qE '^(\*\*⚠ BREAKING CHANGES\*\*|### Features|### Fixes)$' "${NOTES_FILE}"; then
            echo "release=true" >> "${GITHUB_OUTPUT}"
          else
            echo "release=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Tag, move major tag, and publish release
        if: steps.gate.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.notes.outputs.version }}
          NOTES_FILE: ${{ steps.notes.outputs.file }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="v${VERSION}"
          major="v${VERSION%%.*}"
          git tag -a "${tag}" -m "Release ${VERSION}"
          # Force-move the major tag so consumers on @vN get this release.
          git tag -f -a "${major}" -m "${major} -> ${VERSION}"
          git push origin "${tag}"
          git push origin -f "${major}"
          # The generated notes file is the GitHub Release body.
          gh release create "${tag}" --title "${VERSION}" --notes-file "${NOTES_FILE}"

      - name: No release changes
        if: steps.gate.outputs.release != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "::notice title=NO RELEASE CHANGES::No BREAKING / feat / fix commits since the last release; nothing was tagged or released."
          {
            echo "## NO RELEASE CHANGES"
            echo
            echo "No BREAKING / feat / fix commits since the last release."
          } >> "${GITHUB_STEP_SUMMARY}"
